<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matthew Zhang</title>
  <meta name="description" content="Matthew Zhang — researching voice models at Interact.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7f5f0;
      --text: #1c1b19;
      --muted: #8a857c;
      --rule: #e3dfd6;
      --accent: #b4532a;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #161513; --text: #ece8e1; --muted: #8f897f; --rule: #2c2a26; --accent: #e08a5e; }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      font-size: 15.5px;
      line-height: 1.6;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 64px 24px;
      -webkit-font-smoothing: antialiased;
    }
    main { width: 100%; max-width: 520px; }

    header { display: flex; align-items: center; gap: 20px; margin-bottom: 40px; }
    header img {
      width: 84px; height: 84px;
      border-radius: 14px;
      object-fit: cover;
      object-position: center 30%;
      flex-shrink: 0;
    }
    h1 {
      font-family: "Instrument Serif", Georgia, serif;
      font-weight: 400;
      font-size: 40px;
      line-height: 1;
      letter-spacing: -0.01em;
    }
    .domain {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 12.5px;
      color: var(--muted);
      margin-top: 8px;
    }

    dl { border-top: 1px solid var(--rule); }
    .row {
      display: grid;
      grid-template-columns: 104px 1fr;
      gap: 16px;
      padding: 14px 0;
      border-bottom: 1px solid var(--rule);
    }
    dt {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 12px;
      text-transform: lowercase;
      color: var(--muted);
      padding-top: 3px;
    }
    a {
      color: inherit;
      text-decoration: underline;
      text-decoration-color: var(--accent);
      text-decoration-thickness: 1.5px;
      text-underline-offset: 3px;
      transition: color 200ms;
    }
    a:hover { color: var(--accent); }
    .accent { color: var(--accent); }

    .fade { opacity: 0; animation: rise 700ms cubic-bezier(.2,.7,.2,1) forwards; }
    .d1 { animation-delay: 80ms; } .d2 { animation-delay: 200ms; } .d3 { animation-delay: 300ms; }
    .d4 { animation-delay: 400ms; } .d5 { animation-delay: 500ms; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .fade { animation: none; opacity: 1; } }

    @media (max-width: 480px) {
      body { padding: 48px 16px; align-items: flex-start; }
      h1 { font-size: 34px; }
      header img { width: 72px; height: 72px; }
      .row { grid-template-columns: 1fr; gap: 2px; }
    }
  </style>
</head>
<body>
  <main>
    <header class="fade d1">
      <img src="assets/profile.jpg" alt="Photo of Matthew">
      <div>
        <h1>Matthew Zhang</h1>
        <div class="domain">math.you</div>
      </div>
    </header>
    <dl>
      <div class="row fade d2">
        <dt>Work</dt>
        <dd>Researching voice models at <a href="https://interact.inc" target="_blank" rel="noopener">Interact</a>.</dd>
      </div>
      <div class="row fade d3">
        <dt>Studied</dt>
        <dd>Engineering at Cambridge.</dd>
      </div>
      <div class="row fade d3">
        <dt>Research</dt>
        <dd>Physics and robotics.</dd>
      </div>
      <div class="row fade d4">
        <dt>Off hours</dt>
        <dd>Hockey and lacrosse.</dd>
      </div>
      <div class="row fade d5">
        <dt>Contact</dt>
        <dd>matthew <span class="accent">[at]</span> extrian <span class="accent">[dot]</span> com</dd>
      </div>
    </dl>
  </main>
</body>
</html>
